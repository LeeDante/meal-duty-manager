<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f6f8">
  <title>長時工作訂餐管理</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <section id="loginView" class="login-shell">
      <div class="login-card">
        <div class="brand-mark">餐</div>
        <h1>長時工作訂餐管理</h1>
        <p>管理者專用</p>
        <form id="loginForm">
          <label>共用密碼
            <input id="passwordInput" type="password" autocomplete="current-password" required autofocus>
          </label>
          <label>操作人
            <input id="actorInput" type="text" value="管理者" maxlength="20">
          </label>
          <button class="btn primary wide" type="submit">登入</button>
        </form>
        <div id="loginError" class="error-text"></div>
      </div>
    </section>

    <section id="mainView" class="app-shell hidden">
      <header class="topbar">
        <div>
          <h1>長時工作訂餐管理</h1>
          <span id="syncText">資料已同步</span>
        </div>
        <button id="logoutBtn" class="btn ghost small">登出</button>
      </header>

      <main id="content" class="content"></main>

      <nav class="bottom-nav" aria-label="主要功能">
        <button data-page="home" class="active"><span>⌂</span>首頁</button>
        <button data-page="events"><span>▣</span>活動</button>
        <button data-page="orders"><span>＋</span>訂餐</button>
        <button data-page="pickup"><span>✓</span>領餐</button>
        <button data-page="charges"><span>$</span>收費</button>
        <button data-page="more"><span>•••</span>管理</button>
      </nav>
    </section>
  </div>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-panel">
      <button class="modal-close" data-close-modal aria-label="關閉">×</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="app.js"></script>
</body>
</html>
